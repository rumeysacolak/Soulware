    function animateTextIn(text, callback) {
  const h1 = document.querySelector(".animated-text");
  h1.innerHTML = "";
  [...text].forEach((char, index) => {
    const span = document.createElement("span");
    span.textContent = char === " " ? "\u00A0" : char;
    span.style.opacity = "0";
    span.style.display = "inline-block";
    span.style.animation = `fadeLetterIn 0.05s forwards`;
    span.style.animationDelay = `${index * 0.05}s`;
    h1.appendChild(span);
  });

  if (callback) {
    setTimeout(callback, text.length * 50 + 500);
  }
}

function animateTextOut(callback) {
  const spans = document.querySelectorAll(".animated-text span");
  spans.forEach((span, index) => {
    span.style.animation = `fadeLetterOut 0.05s forwards`;
    span.style.animationDelay = `${index * 0.05}s`;
  });

  if (callback) {
    setTimeout(callback, spans.length * 50 + 500);
  }
}
function animateDynamicText(text, elementId, speed = 50) {
  const element = document.getElementById(elementId);
  element.innerHTML = "";
  let i = 0;

  function type() {
    if (i < text.length) {
      const span = document.createElement("span");
      const char = text.charAt(i) === " " ? "\u00A0" : text.charAt(i);
      span.textContent = char;
      span.style.opacity = "0";
      span.style.display = "inline-block";
      span.style.animation = `fadeLetterIn 0.05s forwards`;
      span.style.animationDelay = `${i * 0.05}s`;
      element.appendChild(span);
      i++;
      setTimeout(type, speed);
    }
  }

  type();
}

startBtn.addEventListener("click", () => {

  navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
    // Kamera erişimi verildi → geri sayımı başlat
    stream.getTracks().forEach(track => track.stop()); // Kamerayı backend'e bırak
    animateTextOut(() => {
      animateTextIn("Öyleyse başlıyoruz...", () => {
        startBtn.style.display = "none";
        startCountdown(3);
      });
    });
  }).catch(err => {
    alert("Kamera izni vermen gerekiyor.");
  });
});


function startCountdown(n) {
  if (n === 0) {
    countdown.style.display = "none";
    requestCameraAccess();
    return;
  }

  countdown.textContent = n;
  countdown.style.display = "block";
  setTimeout(() => {
    startCountdown(n - 1);
  }, 1000);
}

function requestCameraAccess() {
  navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
    const tracks = stream.getTracks();
    tracks.forEach(track => track.stop()); // Kamerayı kapat, çünkü backend açacak
    socket.emit('start_camera'); // Server'a sinyal gönder
  }).catch(err => {
    alert("Kamera izni gerekli.");
  });
}

function showEmotionScenario(emotion) {
  const container = document.getElementById("scenario");
  container.innerHTML = "";

  const emotionSentence = document.getElementById("emotionSentence");
  const whyButtons = document.getElementById("whyButtons");

  const scenario = emotionScenarios[emotion];
  if (!scenario) return;

  let index = 0;
  function showNextMessage() {
    if (index < scenario.messages.length) {
      const message = scenario.messages[index];
      animateDynamicText(message, "emotionSentence");

      // Her harf için 50ms + 500ms ek süre
      const delay = message.length * 50 + 1000;
      index++;
      setTimeout(showNextMessage, delay);
    } else {
      // Cümleler bittikten sonra butonları göster
      whyButtons.innerHTML = "";
      scenario.buttons.forEach(reason => {
        const button = document.createElement("button");
        button.textContent = reason;
        button.onclick = () => goToPlaylist(reason);
        whyButtons.appendChild(button);
      });
    }
  }

  showNextMessage();
}

                    alert(`Seçilen neden: ${reason}`);
                };
                whyButtonsDiv.appendChild(btn);
            });
        }, 1000);
    }, 2000);
}

function typeWriter(text, elementId, speed = 50) {
    const element = document.getElementById(elementId);
    element.innerHTML = "";
    let i = 0;

    function type() {
      if (i < text.length) {
        element.innerHTML += text.charAt(i);
        i++;
        setTimeout(type, speed);
      }
    }

    type();
  }
  function animateDynamicText(text, elementId, speed = 50) {
  const element = document.getElementById(elementId);
  element.innerHTML = "";
  [...text].forEach((char, index) => {
    const span = document.createElement("span");
    span.textContent = char === " " ? "\u00A0" : char;
    span.style.opacity = "0";
    span.style.display = "inline-block";
    span.style.animation = `fadeLetterIn 0.05s forwards`;
    span.style.animationDelay = `${index * speed}ms`;
    element.appendChild(span);
  });
}
